<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Registar Lote - Terra Viva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <h2>Registar Novo Lote de Hortaliças</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" class="card p-4 shadow-sm mt-3">
            <div class="mb-3">
                <label for="nome_item" class="form-label">Nome do Item</label>
                <input type="text" class="form-control" id="nome_item" name="nome_item" required>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="quantidade" class="form-label">Quantidade</label>
                    <input type="number" class="form-control" id="quantidade" name="quantidade" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="unidade" class="form-label">Unidade de Medida</label>
                    <select class="form-select" id="unidade" name="unidade">
                        <option value="kg">kg</option>
                        <option value="unidades">unidades</option>
                        facet<option value="maços">maços</option>
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="data_entrada" class="form-label">Data de Entrada</label>
                    <input type="date" class="form-control" id="data_entrada" name="data_entrada" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="data_validade" class="form-label">Data de Validade</label>
                    <input type="date" class="form-control" id="data_validade" name="data_validade" required>
                </div>
            </div>
            <div class="d-flex justify-content-between mt-3">
                <a href="/" class="btn btn-secondary" style="min-width: 44px; min-height: 44px;">Cancelar</a>
                <button type="submit" class="btn btn-primary" style="min-width: 44px; min-height: 44px;">Salvar Lote</button>
            </div>
        </form>
    </div>
</body>
</html>
