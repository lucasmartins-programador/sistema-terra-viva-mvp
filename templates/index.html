<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Terra Viva - Gestão Solidária</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <header class="mb-4">
            <h2>🌱 Terra Viva <small class="text-muted fs-6">Sistema de Gestão do Fluxo de Produção e Estoque Solidário</small></h2>
            <p class="text-secondary">Olá, Coordenador de Plantão</p>
        </header>
        <div class="row text-center">
            <div class="col-md-6 mb-3">
                <div class="card p-4 shadow-sm">
                    <h4>Cadastrar Novo Lote</h4>
                    <p class="text-muted">Registar entradas matinais de hortaliças.</p>
                    <a href="/cadastrar" class="btn btn-primary btn-lg" style="min-width: 44px; min-height: 44px;">Aceder Cadastro</a>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="card p-4 shadow-sm">
                    <h4>Gerir Lote de Stock</h4>
                    <p class="text-muted">Consultar painel de validades e alertas.</p>
                    <a href="/painel" class="btn btn-success btn-lg" style="min-width: 44px; min-height: 44px;">Ver Painel</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
